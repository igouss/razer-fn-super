[workspace]
members = [".", "core"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/igouss/razer-fn-super"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[package]
name = "razer-fn-super"
version = "0.1.0"
description = "Make the Razer BlackWidow Elite FN key act as Super and give its media keys key codes"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.hex-arch]
role = "composition-root"

[dependencies]
evdev = "0.13"
libc = "0.2"
razer-fn-super-core = { path = "core" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints]
workspace = true
